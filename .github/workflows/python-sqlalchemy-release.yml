name: Release SQLAlchemy

permissions: {}

on:
  push:
    tags:
      - "python/sqlalchemy/v*"

defaults:
  run:
    working-directory: python/sqlalchemy

jobs:
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.sha }}
          # Gate only on this package's own CI checks. The repo is a monorepo, so
          # the release commit also carries unrelated checks (other ORMs, other
          # release runs' changelog jobs, Dependabot) that must not block — or
          # fail — this publish. The SQLAlchemy integration-test matrix depends
          # transitively on build + cluster creation, so it's sufficient.
          check-regexp: "^test \\(3\\.\\d+, psycopg2?\\)$"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  build:
    name: Build distribution
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Build distribution packages
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-sqlalchemy-dist
          path: python/sqlalchemy/dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aurora-dsql-sqlalchemy
    permissions:
      id-token: write # required by pypa/gh-action-pypi-publish

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-sqlalchemy-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aurora-dsql-sqlalchemy
    permissions:
      id-token: write # required by pypa/gh-action-pypi-publish

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-sqlalchemy-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  update-changelog:
    needs: publish-to-pypi
    uses: ./.github/workflows/update-changelog.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
