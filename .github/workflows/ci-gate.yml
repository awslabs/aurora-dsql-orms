# Orchestrates all PR CI by detecting changed paths and conditionally invoking
# per-language workflows. The "gate" job always runs and can be configured as
# the single required status check in GitHub branch protection.
name: CI Gate

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Exact commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ""
      pull-request-base-sha:
        description: "Exact pull request base commit used for changed-path detection"
        required: false
        type: string
        default: ""
      pull-request-number:
        description: "Pull request used for changed-path detection"
        required: false
        type: number
        default: 0
      run-integration:
        description: "Allow jobs that use AWS credentials"
        required: false
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet-ef-core: ${{ steps.detect.outputs.dotnet-ef-core }}
      java-hibernate: ${{ steps.detect.outputs.java-hibernate }}
      node-prisma: ${{ steps.detect.outputs.node-prisma }}
      node-drizzle: ${{ steps.detect.outputs.node-drizzle }}
      python-django: ${{ steps.detect.outputs.python-django }}
      python-sqlalchemy: ${{ steps.detect.outputs.python-sqlalchemy }}
      python-tortoise: ${{ steps.detect.outputs.python-tortoise }}
      checkout-ref: ${{ steps.detect.outputs.checkout-ref }}
      run-integration: ${{ steps.detect.outputs.run-integration }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: detect
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          PULL_REQUEST_BASE_SHA: ${{ inputs.pull-request-base-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          RUN_INTEGRATION: ${{ inputs.run-integration }}
        with:
          script: |
            const config = {
              'dotnet-ef-core': ['dotnet/ef-core/', '.github/workflows/dotnet-ef-core-ci.yml'],
              'java-hibernate': ['java/hibernate/', '.github/workflows/java-hibernate-ci.yml'],
              'node-prisma': ['node/prisma/', '.github/workflows/node-prisma-ci.yml'],
              'node-drizzle': ['node/drizzle/', '.github/workflows/node-drizzle-ci.yml'],
              'python-django': ['python/django/', '.github/workflows/python-django-ci.yml'],
              'python-sqlalchemy': ['python/sqlalchemy/', '.github/workflows/python-sqlalchemy-ci.yml'],
              'python-tortoise': ['python/tortoise-orm/', '.github/workflows/python-tortoise-ci.yml'],
            };
            const runAllPaths = [
              '.github/workflows/ci-gate.yml',
              '.github/workflows/dsql-cluster-create.yml',
              '.github/workflows/dsql-cluster-delete.yml',
              '.github/workflows/manual-ci.yml',
              '.github/workflows/trusted-pr-integration.yml',
              '.github/workflows/trusted-pr-integration-runner.yml',
              '.pre-commit-config.yaml',
            ];

            let pr = context.payload.pull_request;
            if (!pr && context.ref !== 'refs/heads/main') {
              core.setFailed('Reusable CI calls without a PR event must run from main');
              return;
            }

            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            if (!pr && pullNumber) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              pr = response.data;
            }

            const requestedHead = process.env.CHECKOUT_REF.toLowerCase();
            const requestedBase = process.env.PULL_REQUEST_BASE_SHA.toLowerCase();
            if (Boolean(requestedHead) !== Boolean(requestedBase)) {
              core.setFailed(
                'checkout-ref and pull-request-base-sha must be provided together'
              );
              return;
            }

            const sameRepository = !pr ||
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const runIntegration =
              process.env.RUN_INTEGRATION === 'true' || sameRepository;
            core.setOutput('run-integration', String(runIntegration));

            // Manual dispatch: run all CI
            if (!pr) {
              core.setOutput('checkout-ref', context.sha);
              for (const name of Object.keys(config)) {
                core.setOutput(name, 'true');
              }
              return;
            }

            const compareHead = requestedHead || pr.head.sha;
            const baseSha = requestedBase || pr.base.sha;
            const checkoutRef = requestedHead || context.sha;
            if (!/^[0-9a-f]{40}$/.test(compareHead) ||
                !/^[0-9a-f]{40}$/.test(baseSha)) {
              core.setFailed('Changed-path detection requires full commit SHAs');
              return;
            }
            if (pr.head.sha !== compareHead || pr.base.sha !== baseSha) {
              core.setFailed(
                `Pull request revisions changed: expected ${baseSha}...${compareHead}, ` +
                `found ${pr.base.sha}...${pr.head.sha}`
              );
              return;
            }
            core.setOutput('checkout-ref', checkoutRef);

            const response = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${baseSha}...${compareHead}`,
            });
            const changedFiles = response.data.files || [];
            const files = changedFiles.flatMap(f =>
              [f.filename, f.previous_filename].filter(Boolean)
            );

            // The compare API returns at most 300 files.
            let runAll = changedFiles.length >= 300;
            if (!runAll) {
              runAll = files.some(f => runAllPaths.some(p => f === p || f.startsWith(p)));
            }

            for (const [name, paths] of Object.entries(config)) {
              const shouldRun = runAll || files.some(f => paths.some(p => f.startsWith(p)));
              core.setOutput(name, String(shouldRun));
            }

  pre-commit:
    needs: changes
    uses: ./.github/workflows/pre-commit.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}

  dotnet-ef-core:
    needs: changes
    if: needs.changes.outputs.dotnet-ef-core == 'true'
    uses: ./.github/workflows/dotnet-ef-core-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  java-hibernate:
    needs: changes
    if: needs.changes.outputs.java-hibernate == 'true'
    uses: ./.github/workflows/java-hibernate-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  node-prisma:
    needs: changes
    if: needs.changes.outputs.node-prisma == 'true'
    uses: ./.github/workflows/node-prisma-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  node-drizzle:
    needs: changes
    if: needs.changes.outputs.node-drizzle == 'true'
    uses: ./.github/workflows/node-drizzle-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  python-django:
    needs: changes
    if: needs.changes.outputs.python-django == 'true'
    uses: ./.github/workflows/python-django-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  python-sqlalchemy:
    needs: changes
    if: needs.changes.outputs.python-sqlalchemy == 'true'
    uses: ./.github/workflows/python-sqlalchemy-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  python-tortoise:
    needs: changes
    if: needs.changes.outputs.python-tortoise == 'true'
    uses: ./.github/workflows/python-tortoise-ci.yml
    with:
      checkout-ref: ${{ needs.changes.outputs.checkout-ref }}
      run-integration: ${{ needs.changes.outputs.run-integration == 'true' }}
    secrets: inherit
    permissions:
      id-token: write # required by aws-actions/configure-aws-credentials

  gate:
    name: gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - pre-commit
      - dotnet-ef-core
      - java-hibernate
      - python-django
      - python-sqlalchemy
      - python-tortoise
      - node-prisma
      - node-drizzle
    if: always()
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            for (const [job, result] of Object.entries(needs)) {
              if (result.result === 'failure' || result.result === 'cancelled') {
                core.setFailed(`Job ${job} ${result.result}`);
              }
            }

  integration-status:
    name: Report DSQL integration result
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, gate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run-integration }}
        with:
          script: |
            const passed =
              process.env.RUN_INTEGRATION === 'true' &&
              process.env.GATE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: 'dsql-integration',
              description: passed
                ? 'DSQL integration tests passed'
                : 'DSQL integration tests failed',
              target_url:
                `https://github.com/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`,
            });
            if (!passed) {
              core.setFailed(`CI gate ${process.env.GATE_RESULT}`);
            }
