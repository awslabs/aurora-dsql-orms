name: Trusted PR Integration
run-name: Trusted PR #${{ inputs.pull-request-number }} @ ${{ inputs.head-sha }}

permissions: {}
cache-mode: read

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Open pull request to test"
        required: true
        type: number
      head-sha:
        description: "Exact current head SHA shown on the pull request"
        required: true
        type: string

jobs:
  authorize:
    name: Authorize exact PR commit
    runs-on: ubuntu-latest
    environment: pr-integration
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      head-sha: ${{ steps.validate.outputs.head-sha }}
    steps:
      - uses: actions/github-script@v9
        id: validate
        env:
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        with:
          script: |
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const expectedHead = process.env.EXPECTED_HEAD_SHA.toLowerCase();
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed('Pull request number must be a positive integer');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHead)) {
              core.setFailed('Head SHA must be a full 40-character commit SHA');
              return;
            }

            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const pr = response.data;
            if (pr.state !== 'open') {
              core.setFailed(`Pull request #${pullNumber} is not open`);
              return;
            }
            if (pr.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.base.ref !== 'main') {
              core.setFailed(`Pull request #${pullNumber} does not target main`);
              return;
            }
            if (pr.head.sha !== expectedHead) {
              core.setFailed(
                `Pull request head changed: expected ${expectedHead}, found ${pr.head.sha}`
              );
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedHead,
              state: 'pending',
              context: 'dsql-integration',
              description: 'Trusted DSQL integration tests are running',
              target_url:
                `https://github.com/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`,
            });
            core.setOutput('head-sha', expectedHead);

  integration:
    needs: authorize
    uses: awslabs/aurora-dsql-orms/.github/workflows/ci-gate.yml@main
    with:
      checkout-ref: ${{ needs.authorize.outputs.head-sha }}
      pull-request-number: ${{ inputs.pull-request-number }}
      run-integration: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      pull-requests: read

  report:
    name: Report trusted integration result
    if: always() && needs.authorize.result == 'success'
    needs: [authorize, integration]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.head-sha }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        with:
          script: |
            const passed = process.env.INTEGRATION_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: 'dsql-integration',
              description: passed
                ? 'Trusted DSQL integration tests passed'
                : 'Trusted DSQL integration tests failed',
              target_url:
                `https://github.com/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`,
            });
            if (!passed) {
              core.setFailed(`Integration workflow ${process.env.INTEGRATION_RESULT}`);
            }
